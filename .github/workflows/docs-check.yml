name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-docs.txt
      - name: Run collector tests
        run: python -m pytest
      - name: Collect approved documentation
        run: python scripts/collect_docs.py --manifest docs-manifest.yml --output docs
      - name: Validate publication boundary
        run: python scripts/validate_docs.py --manifest docs-manifest.yml --docs docs
      - name: Build strict site
        run: mkdocs build --strict
