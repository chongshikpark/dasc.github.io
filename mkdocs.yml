site_name: DASC Documentation
site_description: Documentation portal for DASC and PyDASC
site_url: https://chongshikpark.github.io/dasc.github.io/
repo_name: chongshikpark/dasc.github.io
repo_url: https://github.com/chongshikpark/dasc.github.io
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  CODEX_TASK_WEBSITE.md
  codex_tasks.md
  architecture/
  exec-plans/
  operations/
  generated-inventory.json

extra_css:
  - assets/stylesheets/extra.css

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Choose a project: getting-started.md
  - PyDASC:
      - Overview: pydasc/index.md
      - Guides:
          - Simulation workflow: pydasc/guides/simulation-workflow.md
      - Reference:
          - Public API policy: pydasc/reference/public-api.md
          - Conventions: pydasc/reference/conventions.md
  - DASC:
      - Overview: dasc/index.md
  - Contribute: contributing.md
